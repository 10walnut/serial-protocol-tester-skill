name: Validate Skill

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate sample protocol
        run: python scripts/validate_protocol.py examples/sample_protocol.json
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
